<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabel Data Mahasiswa</title>
        <link rel="stylesheet" href="style0.css">
    </head>

    <body>
        <header>
            <h1>Tabel Data Buku</h1>
        </header>

        <main>
            <table>
                <caption>Data Buku</caption>
                <thead>
                <tr>
                    <th scope="col">No</th>
                    <th scope="col">Judul</th>
                    <th scope="col">Pengarang</th>
                    <th scope="col">Tahun</th>
                    <th scope="col">Harga</th>
                </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Bumi Manusia</td>
                        <td>Pramoedya Ananta Toer</td>
                        <td>1980</td>
                        <td>189000</td>
                    </tr>      
                </tbody>
            <tfoot>
                <tr>
                    <td colspan="4">Total</td>
                    <td>189000</td>
                </tr>
            </table>
        </main>

    </body>
</html>
